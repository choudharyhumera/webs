<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Webs is ready for development in Alloy." />
    <title>Webs | Alloy Ready</title>
  </head>
  <body style="margin: 0; background: #f2f0e9; color: #18201d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <main style="box-sizing: border-box; min-height: 100vh; padding: clamp(24px, 5vw, 72px); display: flex; align-items: center; justify-content: center;">
      <section style="width: min(100%, 1040px); background: #fffdf7; border: 1px solid #d9d5c8; border-radius: 24px; overflow: hidden; box-shadow: 0 24px 70px rgba(24, 32, 29, 0.1);">
        <header style="padding: 20px clamp(24px, 5vw, 52px); border-bottom: 1px solid #e3dfd3; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
          <strong style="font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase;">Webs</strong>
          <span style="display: inline-flex; align-items: center; gap: 8px; color: #315c4e; font-size: 14px; font-weight: 700;">
            <span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #2f7d62;"></span>
            Alloy environment online
          </span>
        </header>

        <div style="padding: clamp(44px, 8vw, 92px) clamp(24px, 7vw, 76px); display: flex; flex-direction: column; gap: 40px;">
          <div style="max-width: 760px; display: flex; flex-direction: column; gap: 20px;">
            <p style="margin: 0; color: #a54f2b; font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">Development workspace</p>
            <h1 style="margin: 0; max-width: 720px; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(44px, 8vw, 88px); font-weight: 500; line-height: 0.96; letter-spacing: -0.04em;">A clean canvas, ready to build.</h1>
            <p style="margin: 0; max-width: 620px; color: #55605c; font-size: clamp(17px, 2vw, 20px); line-height: 1.65;">The application is running through Docker with an Alloy-ready development setup. Start shaping the next idea from here.</p>
          </div>

          <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <span style="padding: 10px 14px; background: #e4eee9; border: 1px solid #c4d8cf; border-radius: 999px; color: #254e40; font-size: 14px; font-weight: 700;">Node 22</span>
            <span style="padding: 10px 14px; background: #f3e7de; border: 1px solid #e2c9b8; border-radius: 999px; color: #743b24; font-size: 14px; font-weight: 700;">Docker Compose</span>
            <span style="padding: 10px 14px; background: #f1efe8; border: 1px solid #d9d5c8; border-radius: 999px; color: #404a46; font-size: 14px; font-weight: 700;">Port 3000</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
